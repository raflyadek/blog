{{ define "post" }}
<article class="list">

  {{ if .IsHome }}
    {{ range .Site.RegularPages.ByDate.Reverse }}
      <section class="post-item">

        <!-- TITLE -->
        <h2>
          <a href="{{ .RelPermalink }}">
            {{ .Title }}
          </a>
        </h2>

        <!-- SNIPPET (Summary or automatic excerpt) -->
        <p>{{ .Summary }}</p>

        <!-- READ MORE -->
        <p>
          <a href="{{ .RelPermalink }}">Read more →</a>
        </p>

      </section>
    {{ end }}

  {{ else }}
    {{/* Section list (/posts) */}}
    {{ range .Pages.ByDate.Reverse }}
      <section class="post-item">

        <h2>
          <a href="{{ .RelPermalink }}">
            {{ .Title }}
          </a>
        </h2>

        <p>{{ .Summary }}</p>

        <p>
          <a href="{{ .RelPermalink }}">Read more →</a>
        </p>

      </section>
    {{ end }}
  {{ end }}

</article>
{{ end }}
